<article class="customer-result-card" aria-live="polite">
  <span class="customer-result-card__status" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="m5 10.5 3 3 7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </span>

  <h2 class="customer-result-card__title"><strong>Cliente:</strong> {{ customerName() }}</h2>

  <p class="customer-result-card__message">
    Este cliente cuenta con un crédito aprobado<br />por Santander Consumer.
  </p>

  <button class="customer-result-card__action" type="button">
    Iniciar solicitud <span aria-hidden="true">→</span>
  </button>
</article>
