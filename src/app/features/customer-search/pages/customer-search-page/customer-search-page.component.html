<section class="customer-search-page">
  <app-page-header
    title="Buscar cliente"
    description="Ingresa el DNI del cliente para verificar si tiene un crédito aprobado."
    iconSrc="assets/images/Vector.svg"
    iconAlt=""
  />

  <app-customer-search-card
    [loading]="loading()"
    (search)="onSearch($event)"
    (resetSearch)="onResetSearch()"
  />

  @if (searchResult()?.found && searchResult()?.creditApproved) {
    <app-customer-result-card [customerName]="searchResult()?.customerName ?? 'Carlos G.'" />
  }
</section>
